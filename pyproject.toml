[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastlook"
version = "0.1.0"
description = "See every message a cold email campaign would actually send, before it sends."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hernán Gimeno" }]
keywords = ["cold-email", "outbound", "instantly", "heyreach", "linting", "deliverability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/hernangimeno/lastlook"
Issues = "https://github.com/hernangimeno/lastlook/issues"

[project.scripts]
lastlook = "lastlook.cli:main"

[tool.setuptools.packages.find]
include = ["lastlook*"]

[tool.setuptools.package-data]
lastlook = ["schema/*.json"]
